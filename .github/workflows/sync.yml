name: Sync Repositories

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'config/repos.json'
      - '.github/workflows/sync.yml'
      - 'scripts/sync.sh'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.PAT_TOKEN }}
      
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Sync Bot"
          git config --global user.email "sync-bot@github.com"
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq git
      
      - name: Sync repositories
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          chmod +x scripts/sync.sh
          ./scripts/sync.shcontinue-on-error: true
      
      - name: Generate summary
        if: always()
        run: |
          if [ -f sync_report.txt ]; then
            echo "## 📊 Sync Report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            grep -A 15 "Final Summary" sync_report.txt >> $GITHUB_STEP_SUMMARY || true
          fi
      
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-reports-${{ github.run_number }}
          path: |
            sync_report.txt
            sync_errors.logretention-days: 30if-no-files-found: warn
