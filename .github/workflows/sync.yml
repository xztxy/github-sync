name: Sync Repositories

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'config/repos.json'
      - '.github/workflows/sync.yml'
      - 'scripts/sync.sh'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    
    permissions:
      contents: write
      actions: read
    
    steps:
      - name: Checkout sync repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Sync Bot"
          git config --global user.email "sync-bot@github.com"
          git config --global core.compression 0
          git config --global http.postBuffer 524288000
      
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq git
      
      - name: Sync repositories
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x scripts/sync.sh
          ./scripts/sync.sh
        continue-on-error: true
      
      - name: Generate summary
        if: always()
        run: |
          if [ -f sync_report.txt ]; then
            echo "## 📊 Sync Report" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            # 显示统计
            echo "### Statistics" >> $GITHUB_STEP_SUMMARY
            grep -A 10 "Final Summary" sync_report.txt | tail -8 >> $GITHUB_STEP_SUMMARY
            
            echo "" >> $GITHUB_STEP_SUMMARY
            
            echo "### Failed Branches" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            grep "❌.*→" sync_report.txt | head -20 >> $GITHUB_STEP_SUMMARY || echo "No failures" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
      
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sync-reports-${{ github.run_number }}
          path: |
            sync_report.txt
            sync_errors.log
          retention-days: 30
          if-no-files-found: warn
      
      - name: Check results
        if: always()
        run: |
          if [ -f sync_report.txt ]; then
            FAILED=$(grep -c "❌.*→" sync_report.txt || echo "0")
            SUCCESS=$(grep -c "✅.*→" sync_report.txt || echo "0")
            
            echo "Results: $SUCCESS succeeded, $FAILED failed"
            
            if [ "$FAILED" -gt 0 ]; then
              echo "::warning::$FAILED branches failed to sync"
            fi
          fi